<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Refugios | The Loyal Nest</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header class="header">
        <nav class="nav">
            <a href="index.html" class="logo">🐕 The Loyal Nest</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
            </ul>
        </nav>
    </header>

    <div class="map-container">
        
        <div class="map-header">
            <div class="header-content">
                <h1>🗺️ Refugios Cercanos</h1>
            </div>
            <div>
                <button class="btn-primary" onclick="locateUser()">📍 Mi Ubicación</button>
            </div>
        </div>

        <div class="map-layout">
            
            <aside class="filters-sidebar">
                <h3>Filtros</h3>
                <div class="filter-group">
                    <label>Distancia</label>
                    <select id="distanceFilter" onchange="filterShelters()">
                        <option value="10" selected>10 km</option>
                        <option value="50">50 km</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Especies</label>
                    <div class="checkbox-filters">
                        <label class="checkbox-item"><input type="checkbox" name="species" value="perro" checked onchange="filterShelters()"> Perros</label>
                        <label class="checkbox-item"><input type="checkbox" name="species" value="gato" checked onchange="filterShelters()"> Gatos</label>
                    </div>
                </div>
                <p id="sheltersCount" style="text-align:center; font-weight:bold; margin-top:20px;">Cargando...</p>
            </aside>

            <section class="map-content">
                <div class="map-wrapper">
                    <div id="sheltersMap"></div> 
                </div>
            </section>

            <aside class="results-sidebar">
                <div class="results-header">Resultados</div>
                <div class="results-list" id="sheltersList"></div>
            </aside>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>

</body>
</html>
