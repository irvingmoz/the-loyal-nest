<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Refugios | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <a href="index.html" class="logo">🐕 The Loyal Nest</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="search-pets.html">Buscar Mascotas</a></li>
                <li><a href="shelters-map.html" class="active">Refugios</a></li>
                <li><a href="education.html">Educación</a></li>
                <li class="nav-auth">
                    <a href="auth.html" class="btn-outline">Iniciar Sesión</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="map-view">
        
        <div class="map-toolbar">
            <h1>📍 Refugios Cercanos</h1>
            <button class="btn-primary" onclick="locateUser()">📍 Mi Ubicación</button>
        </div>

        <div class="map-grid">
            
            <aside class="sidebar-filters">
                <div class="filters-content">
                    <div class="filters-header">
                        <h3>🔍 Filtros</h3>
                        <button onclick="clearFilters()" class="btn-text">Limpiar</button>
                    </div>

                    <div class="filter-group">
                        <label>Distancia máxima</label>
                        <select id="distanceFilter" onchange="filterShelters()">
                            <option value="5">5 km</option>
                            <option value="10" selected>10 km</option>
                            <option value="25">25 km</option>
                            <option value="50">50 km</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Especies disponibles</label>
                        <div class="checkbox-list">
                            <label><input type="checkbox" name="species" value="perro" checked onchange="filterShelters()"> 🐕 Perros</label>
                            <label><input type="checkbox" name="species" value="gato" checked onchange="filterShelters()"> 🐈 Gatos</label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Calificación mínima</label>
                        <select id="ratingFilter" onchange="filterShelters()">
                            <option value="3">3+ estrellas</option>
                            <option value="4" selected>4+ estrellas</option>
                            <option value="4.5">4.5+ estrellas</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Servicios disponibles</label>
                        <div class="checkbox-list">
                            <label><input type="checkbox" name="services" value="adopcion" checked onchange="filterShelters()"> 🏠 Adopción</label>
                            <label><input type="checkbox" name="services" value="esterilizacion" onchange="filterShelters()"> 💊 Esterilización</label>
                            <label><input type="checkbox" name="services" value="vacunacion" onchange="filterShelters()"> 💉 Vacunación</label>
                            <label><input type="checkbox" name="services" value="urgencias" onchange="filterShelters()"> 🚑 Urgencias</label>
                        </div>
                    </div>

                    <div class="shelters-counter">
                        <strong id="sheltersCount">0</strong> refugios encontrados
                    </div>
                </div>
            </aside>

            <section class="map-canvas-container">
                <div id="sheltersMap"></div>
            </section>

            <aside class="sidebar-results">
                <div class="results-header">
                    <h3>Resultados</h3>
                    <select id="sortResults" onchange="sortShelters()" style="font-size:0.8rem; padding:5px;">
                        <option value="distance">Más cercanos</option>
                        <option value="rating">Mejor calificados</option>
                    </select>
                </div>
                <div id="sheltersList" class="results-list">
                    </div>
            </aside>

        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/session-ui.js"></script>

</body>
</html>
