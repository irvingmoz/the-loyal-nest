<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Mascota | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <nav class="nav">
        <a href="index.html" class="logo">🐕 The Loyal Nest</a>
        <ul class="nav-links">
            <li><a href="dashboard-rescatista.html">Dashboard</a></li>
            <li class="nav-user" style="display:none; gap:8px; align-items:center;">
                <span class="nav-user-name"></span>
                <button class="btn-outline" data-action="logout">Cerrar sesión</button>
            </li>
        </ul>
    </nav>
</header>

<main class="container" style="margin-top:120px; max-width:960px;">
    <h1>Registrar mascota</h1>
    <p>Completa la información básica y adjunta una foto. Podrás editarla desde tu panel.</p>
    <form id="addPetForm" class="form-grid">
        <label>Nombre<input name="name" required></label>
        <label>Especie<select name="species"><option value="Perro">Perro</option><option value="Gato">Gato</option></select></label>
        <label>Edad<input name="age" placeholder="2 años"></label>
        <label>Tamaño<select name="size"><option value="Chico">Chico</option><option value="Mediano">Mediano</option><option value="Grande">Grande</option></select></label>
        <label>Estado<select name="status"><option value="disponible">Disponible</option><option value="en_proceso">En proceso</option><option value="adoptado">Adoptado</option></select></label>
        <label>Descripción<textarea name="description" rows="3"></textarea></label>
        
        <label>Foto de la Mascota
            <input type="file" id="petImageInput" accept="image/*" required>
            
            <div style="margin-top: 10px;">
                <img id="imagePreview" src="" alt="Vista previa" style="display:none; max-width: 200px; max-height: 200px; border-radius: 8px; border: 1px solid #ccc;">
            </div>

            <input type="hidden" name="image" id="petImageBase64">
        </label>
        <label>Refugio<input id="petOwner" name="shelter" placeholder="Nombre del refugio"></label>
        <button class="btn-primary" type="submit">Guardar</button>
        <div id="formStatus" class="muted"></div>
    </form>
</main>

<script src="js/session.js"></script>
<script src="js/pets.js"></script>
<script>
    requireAuth(['rescatista', 'rescuer']);

    // --- SCRIPT NUEVO PARA MANEJAR LA FOTO ---
    // Esto convierte la imagen a texto y muestra la vista previa
    document.getElementById('petImageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const preview = document.getElementById('imagePreview');
        const hiddenInput = document.getElementById('petImageBase64');

        if (file) {
            const reader = new FileReader();
            
            reader.onload = function(evt) {
                // 1. Mostrar la imagen en pantalla
                preview.src = evt.target.result;
                preview.style.display = 'block';

                // 2. Guardar el código de la imagen en el input oculto
                // (Así tu pets.js recibirá el texto de la imagen correctamente)
                hiddenInput.value = evt.target.result;
            };

            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
