<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f9f9; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        .header { background: #fff; padding: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
        .logo { font-weight: bold; font-size: 1.5rem; text-decoration: none; color: #333; }
        .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .auth-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-full { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .form-row { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="logo">🐕 The Loyal Nest</a>
            <a href="index.html" style="text-decoration:none; color:#555;">Volver al Inicio</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1 style="text-align:center; color:#e67e22;">Crear Cuenta</h1>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>Nombre(s)</label>
                    <input type="text" id="nombre" class="form-control" required placeholder="Ej. Ana">
                </div>
                
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>Apellido P.</label>
                        <input type="text" id="apPaterno" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Apellido M.</label>
                        <input type="text" id="apMaterno" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>Edad</label>
                        <input type="number" id="edad" class="form-control" required min="18" max="99">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>CURP (Opcional)</label>
                        <input type="text" id="curp" class="form-control" maxlength="18" placeholder="18 caracteres">
                    </div>
                </div>

<label style="font-weight:600; color:#444; margin-bottom:5px; display:block;">Dirección Completa</label>
<div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 15px;">
    
    <div class="form-row" style="margin-bottom: 10px;">
        <div class="form-group" style="flex: 2;">
            <label style="font-size:0.8rem">Calle / Avenida</label>
            <input type="text" id="dirCalle" class="form-control" required minlength="5" placeholder="Ej. Av. Reforma"
                   oninput="this.value = this.value.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s\.\-]/g, '')">
        </div>
        <div class="form-group" style="flex: 1;">
            <label style="font-size:0.8rem">No. Ext</label>
            <input 
    type="text" 
    id="dirNumExt" 
    class="form-control" 
    required 
    maxlength="10" 
    placeholder="Ej. 10"
    oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:1">
            <label style="font-size:0.8rem">Colonia</label>
            <input type="text" id="dirColonia" class="form-control" required minlength="4"
                   oninput="this.value = this.value.replace(/[^a-zA-Z0-9\-\/]/g, '')">
        </div>
        <div class="form-group" style="flex:1">
            <label style="font-size:0.8rem">Alcaldía</label>
            <select id="dirAlcaldia" class="form-control" required>
                <option value="">Seleccionar...</option>
                <option>Iztapalapa</option>
                <option>Coyoacán</option>
                <option>Cuauhtémoc</option>
                <option>Benito Juárez</option>
                <option>Tlahuac</option>
                <option>Otra</option>
                
            </select>
        </div>
    </div>
</div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="registerEmail" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="registerPassword" class="form-control" required minlength="8">
                </div>

                <div class="form-group">
                    <label>Rol de Usuario</label>
                    <select id="role" class="form-control">
                        <option value="adoptante">Quiero Adoptar</option>
                        <option value="rescatista">Soy Rescatista / Refugio</option>
                        <option value="administrador">Soy Administrador (Demo)</option>
                    </select>
                </div>

                <div id="camposRescatista" style="display:none; background:#fff3e0; padding:10px; border-radius:5px; margin-bottom:15px;">
                    <label>Nombre del Refugio</label>
                    <input type="text" id="estatusLegal" class="form-control">
                </div>

                <button type="submit" class="btn-full">Registrarse</button>
            </form>
            <p style="text-align:center; margin-top:15px;">¿Ya tienes cuenta? <a href="auth.html" style="color:#e67e22;">Inicia sesión</a></p>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
