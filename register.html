<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="logo">🐕 The Loyal Nest</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li class="nav-auth">
                    <a href="auth.html" class="btn-outline">Iniciar Sesión</a>
                    <a href="register.html" class="btn-primary">Registrarse</a>
                </li>
                <li class="nav-user" style="display:none; align-items:center; gap:8px;">
                    <span class="nav-user-name"></span>
                    <button class="btn-outline" data-action="logout">Cerrar sesión</button>
                </li>
            </ul>
        </nav>
    </header>

    <main class="auth-wrapper" style="margin-top:90px;">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="color: var(--primary);">Crea tu cuenta</h2>
                <p>Elige tu rol para personalizar la experiencia.</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" name="name" id="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" name="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" required>
                    <small class="muted">Min. 8 caracteres, incluye mayúscula, número y símbolo.</small>
                </div>

                <div class="form-group">
                    <label>Selecciona tu rol</label>
                    <div class="chip-group">
                        <button type="button" class="chip" data-role-select="adoptante">Adoptante</button>
                        <button type="button" class="chip" data-role-select="rescatista">Rescatista</button>
                        <button type="button" class="chip" data-role-select="rescuer">Rescuer</button>
                        <button type="button" class="chip" data-role-select="administrador">Administrador</button>
                    </div>
                    <input type="hidden" name="role" id="role" value="adoptante">
                </div>

                <button type="submit" class="btn-primary btn-full" style="width: 100%;">Crear cuenta</button>
            </form>

            <div class="auth-switch">
                ¿Ya tienes cuenta? <a href="auth.html" style="color: var(--primary); font-weight: bold;">Inicia sesión</a>
            </div>
        </div>
    </main>

    <script src="js/session.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
