<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar mascotas | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <nav class="nav">
        <a href="index.html" class="logo">🐕 The Loyal Nest</a>
        <ul class="nav-links">
            <li><a href="education.html">Recursos</a></li>
            <li class="nav-user" style="display:none; gap:8px; align-items:center;">
                <span class="nav-user-name"></span>
                <button class="btn-outline" data-action="logout">Salir</button>
            </li>
        </ul>
    </nav>
</header>

<main class="container" style="margin-top:110px; max-width:1100px;">
    <header class="panel__header">
        <div>
            <p class="muted">Explorar</p>
            <h1>Encuentra tu compañero ideal</h1>
        </div>
    </header>

    <form id="searchForm" class="form-grid">
        <label>Especie<select name="species"><option value="">Todas</option><option value="Perro">Perro</option><option value="Gato">Gato</option></select></label>
        <label>Tamaño<select name="size"><option value="">Cualquiera</option><option value="Chico">Chico</option><option value="Mediano">Mediano</option><option value="Grande">Grande</option></select></label>
        <label>Ubicación<input name="location" placeholder="Ciudad"></label>
        <label>Edad mínima<input type="number" name="ageMin" min="0"></label>
        <label>Edad máxima<input type="number" name="ageMax" min="0"></label>
        <button class="btn-primary" type="submit">Buscar</button>
        <div class="form-status muted"></div>
    </form>

    <section class="panel">
        <div id="searchResults" class="cards-grid"></div>
        <div id="searchPagination" class="pagination"></div>
    </section>
</main>

<script src="js/session.js"></script>
<script src="js/search.js"></script>
</body>
</html>
