<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Mascotas | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        
        <header class="page-header">
            <h1>Encuentra a tu compañero ideal 🐾</h1>
            <p>Utiliza los filtros para encontrar la mascota perfecta para ti.</p>
        </header>

        <div id="speciesFilters" class="species-nav">
            <button class="pill pill--active" data-species="">Todos</button>
            <button class="pill" data-species="perro">Perros 🐶</button>
            <button class="pill" data-species="gato">Gatos 🐱</button>
        </div>

        <section class="filters-bar">
            
            <div class="filter-group">
                <input type="text" id="filterSearch" placeholder="🔍 Buscar por nombre...">
            </div>

            <div class="filter-group">
                <select id="filterBreed">
                    <option value="">Todas las razas</option>
                </select>
            </div>

            <div class="filter-group">
                <select id="filterSize">
                    <option value="">Cualquier tamaño</option>
                    <option value="pequeño">Pequeño</option>
                    <option value="mediano">Mediano</option>
                    <option value="grande">Grande</option>
                </select>
            </div>

            <div class="filter-group">
                <select id="filterAge">
                    <option value="">Cualquier edad</option>
                    <option value="cachorro">Cachorro (< 1 año)</option>
                    <option value="adulto">Adulto (1 - 7 años)</option>
                    <option value="senior">Senior (> 7 años)</option>
                </select>
            </div>

        </section>

        <hr>

        <section id="searchResults" class="pets-grid">
            </section>


        <section id="adminPanel" class="admin-section">
            <h2>📋 Solicitudes Recibidas</h2>
            <div id="requestEmpty" class="empty-state">No hay solicitudes todavía.</div>
            
            <div id="requestsTable" class="requests-table">
                <div class="table-header">
                    <span>Solicitante</span>
                    <span>Mascota</span>
                    <span>Estado</span>
                    <span>Acciones</span>
                </div>
                <div id="requestsBody"></div>
            </div>
        </section>

    </main>

    <aside id="adoptionDrawer" class="drawer">
        <div class="drawer-content">
            <div class="drawer-header">
                <h2>Adoptar a <span id="drawerPetName"></span></h2>
                <button id="closeDrawer" class="btn-close">×</button>
            </div>
            <p id="drawerPetMeta" class="muted-text"></p>
            
            <form id="adoptionForm">
                <label>Tu nombre completo</label>
                <input type="text" name="applicant" required placeholder="Ej: Juan Pérez">
                
                <label>Correo electrónico</label>
                <input type="email" name="email" required placeholder="juan@ejemplo.com">
                
                <label>¿Por qué quieres adoptar?</label>
                <textarea name="message" rows="4" required></textarea>
                
                <div class="drawer-actions">
                    <button type="submit" class="btn-primary">Enviar Solicitud</button>
                    <button type="button" id="cancelDrawer" class="btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </aside>

    <script src="js/pets.js"></script>

</body>
</html>
