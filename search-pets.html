<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Mascotas | The Loyal Nest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS GENERALES --- */
        :root {
            --primary: #e67e22; /* Naranja */
            --secondary: #2c3e50;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-light: #f9f9f9;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: var(--bg-light); 
            color: var(--text-dark); 
        }
        
        /* --- NAVBAR EXACTO (Estilo Refugios/Educación) --- */
        nav { 
            background: #ffffff; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            /* Sombra muy suave, SIN línea negra */
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        /* 1. Logo */
        .logo { 
            font-size: 1.4rem; 
            font-weight: 800; 
            color: var(--primary); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .logo i { font-size: 1.2rem; }

        /* 2. Menú Central */
        .nav-center {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-link:hover { color: var(--primary); }
        
        /* Clase para la pestaña activa */
        .nav-link.active {
            color: var(--primary);
            font-weight: 700;
        }

        /* 3. Botón Sesión (Estilo "Cápsula" suave) */
        .btn-login {
            text-decoration: none;
            padding: 10px 25px;
            background: #ffffff;
            border: 1px solid #e0e0e0; /* Borde gris muy suave */
            border-radius: 50px; /* Muy redondeado */
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(230, 126, 34, 0.15);
        }

        /* --- HERO & FILTROS --- */
        .hero { 
            text-align: center; 
            padding: 60px 20px; 
            background: white; 
            margin-bottom: 20px; 
        }
        
        .hero h1 { 
            font-size: 2.2rem; 
            color: var(--secondary); 
            margin-bottom: 10px; 
            font-weight: 700;
        }
        
        .hero p { 
            color: #7f8c8d; 
            font-size: 1.1rem; 
            margin-bottom: 30px; 
        }

        /* Contenedor de Filtros Limpio */
        .filters-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* Pills (Botones de Especie) */
        .pill {
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid #eee;
            background: #fff;
            color: #555;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .pill:hover { background: #f9f9f9; }
        
        .pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }

        /* Inputs y Selects estilo moderno */
        .modern-select, .modern-input {
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #eee;
            background: #fff;
            color: #555;
            outline: none;
            font-size: 0.95rem;
        }

        .search-wrapper { position: relative; }
        .search-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .modern-input { padding-left: 35px; width: 200px; }

        /* --- GRID RESULTADOS --- */
        .pets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .pet-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #f0f0f0; /* Borde casi invisible */
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .pet-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .pet-img-container { height: 250px; position: relative; }
        .pet-img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255,255,255,0.95);
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 700; color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .pet-info { padding: 25px; text-align: center; }
        .pet-name { font-size: 1.5rem; color: var(--text-dark); margin: 0 0 5px; font-weight: 700; }
        .pet-breed { color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-bottom: 15px; display: block; }
        .pet-meta { color: #888; font-size: 0.9rem; margin-bottom: 20px; }

        .tags { display: flex; gap: 8px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .tag { color: #666; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; }

        .btn-action {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            background: #27ae60; /* Verde para acción principal */
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-action:hover { background: #219150; }

        /* Responsive */
        @media (max-width: 900px) {
            nav { flex-direction: column; gap: 15px; padding: 20px; }
            .nav-center { flex-wrap: wrap; justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <i class="fas fa-paw"></i> The Loyal Nest
        </a>
        
        <div class="nav-center">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="search-pets.html" class="nav-link active">Buscar Mascotas</a>
            <a href="shelters-map.html" class="nav-link">Refugios</a>
            <a href="education.html" class="nav-link"><i class="fas fa-book-open" style="font-size:0.9rem;"></i> Educación</a>
        </div>

        <div id="auth-section">
            <a href="auth.html" id="nav-login" class="btn-login">Iniciar Sesión</a>
            
            <div id="nav-user" style="display:none; gap:10px; align-items:center;">
                <span style="font-weight:600; color:#555;">Mi Cuenta</span>
                <button class="btn-login" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <h1>Encuentra a tu compañero ideal <i class="fas fa-paw" style="color:#555; font-size:1.8rem;"></i></h1>
        <p>Utiliza los filtros para encontrar la mascota perfecta para ti.</p>
        
        <div class="filters-container">
            <div id="speciesFilters" style="display:flex; gap:10px;">
                <button class="pill active" data-species="">Todos</button>
                <button class="pill" data-species="perro">Perros 🐶</button>
                <button class="pill" data-species="gato">Gatos 🐱</button>
            </div>

            <select id="filterSize" class="modern-select">
                <option value="">Cualquier tamaño</option>
                <option value="pequeño">Pequeño</option>
                <option value="mediano">Mediano</option>
                <option value="grande">Grande</option>
            </select>
            
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="filterSearch" class="modern-input" placeholder="Buscar por nombre...">
            </div>
        </div>
    </section>

    <div id="petsContainer" class="pets-grid">
        </div>

    <script src="js/auth.js"></script>
    <script>
        const petsData = [
            // PERROS
            { id: 1, name: "Bruno", species: "perro", breed: "Labrador", size: "grande", age: "3 años", desc: "Bruno es un labrador chocolate ideal para familias activas.", tags: ["juguetón", "sociable"], img: "https://images.unsplash.com/photo-1552053831-71594a27632d?w=500&q=80" },
            { id: 2, name: "Maya", species: "perro", breed: "Corgi", size: "pequeño", age: "9 meses", desc: "Maya es pequeña pero con mucha personalidad. Ama aprender trucos.", tags: ["tierna", "curiosa"], img: "https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?w=500&q=80" },
            { id: 3, name: "Coco", species: "perro", breed: "Poodle", size: "pequeño", age: "2 años", desc: "Perfecto para departamentos, muy limpio y educado.", tags: ["cariñoso", "listo"], img: "https://images.unsplash.com/photo-1591769225440-811ad7d6eca6?w=500&q=80" },
            { id: 4, name: "Rocky", species: "perro", breed: "Pastor Alemán", size: "grande", age: "4 años", desc: "Un guardián noble que busca un compañero de aventuras.", tags: ["leal", "protector"], img: "https://images.unsplash.com/photo-1589941013453-ec89f33b5e95?w=500&q=80" },
            
            // GATOS
            { id: 5, name: "Luna", species: "gato", breed: "Mestizo", size: "pequeño", age: "1 año", desc: "Luna es una gatita negra muy elegante y tranquila.", tags: ["tranquila", "pequeño"], img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500&q=80" },
            { id: 6, name: "Michi", species: "gato", breed: "Atigrado", size: "mediano", age: "6 meses", desc: "Michi es un torbellino de energía, ideal para jugar.", tags: ["juguetón", "mediano"], img: "https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?w=500&q=80" },
            { id: 7, name: "Simba", species: "gato", breed: "Persa", size: "mediano", age: "3 años", desc: "Rey de la casa, busca un sofá cómodo y muchos mimos.", tags: ["peludo", "noble"], img: "https://images.unsplash.com/photo-1574158622682-e40e69881006?w=500&q=80" },
            { id: 8, name: "Nieve", species: "gato", breed: "Blanco", size: "pequeño", age: "2 años", desc: "Tímida al principio pero muy dulce cuando entra en confianza.", tags: ["dulce", "tímida"], img: "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=500&q=80" }
        ];

        const container = document.getElementById('petsContainer');
        let currentSpecies = "";
        let currentSize = "";
        let currentSearch = "";

        function renderPets() {
            container.innerHTML = "";
            const filtered = petsData.filter(pet => {
                const matchSpecies = currentSpecies === "" || pet.species === currentSpecies;
                const matchSize = currentSize === "" || pet.size === currentSize;
                const matchSearch = pet.name.toLowerCase().includes(currentSearch);
                return matchSpecies && matchSize && matchSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:#777;'>No encontramos mascotas con esos filtros.</p>";
                return;
            }

            filtered.forEach(pet => {
                const tagsHTML = pet.tags.map(tag => `<span class="tag"><i class="fas fa-tag" style="font-size:0.
