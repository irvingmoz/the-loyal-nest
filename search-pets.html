<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Mascotas | The Loyal Nest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS GENERALES --- */
        :root {
            --primary: #e67e22; /* Naranja Principal */
            --secondary: #2c3e50;
            --text-dark: #333;
            --bg-light: #f9f9f9;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg-light); color: var(--text-dark); }
        
        /* --- NAVBAR --- */
        nav { 
            background: #ffffff; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: none; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .logo { 
            font-size: 1.8rem; 
            font-weight: 800; 
            color: var(--primary); 
            text-decoration: none; 
            display: flex; align-items: center; gap: 10px; 
        }

        .nav-center { display: flex; gap: 35px; align-items: center; }
        
        .nav-link {
            text-decoration: none; 
            color: #555; 
            font-weight: 600; 
            font-size: 1.15rem; 
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--primary); }
        .nav-link.active { color: var(--primary); font-weight: 700; }

        /* --- BOTÓN INICIAR SESIÓN (CAMBIO A GRIS -> NARANJA) --- */
        .btn-login {
            text-decoration: none; 
            padding: 10px 28px; 
            background: transparent; 
            /* 1. Estado Normal: GRIS */
            border: 2px solid #ccc; 
            color: #777; 
            
            border-radius: 50px;
            font-size: 1.05rem; 
            font-weight: 700; 
            transition: all 0.3s ease; 
            cursor: pointer;
        }
        
        /* 2. Estado Mouse Encima: NARANJA */
        .btn-login:hover {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4);
        }

        /* --- HERO & FILTROS --- */
        .hero { text-align: center; padding: 70px 20px; background: white; margin-bottom: 20px; }
        .hero h1 { font-size: 2.8rem; color: var(--secondary); margin-bottom: 15px; font-weight: 800; }
        .hero p { color: #7f8c8d; font-size: 1.25rem; margin-bottom: 35px; }

        .filters-container {
            max-width: 950px; margin: 0 auto;
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; align-items: center;
        }

        .pill {
            padding: 12px 28px; border-radius: 30px; border: 1px solid #eee;
            background: #fff; color: #555; cursor: pointer; font-weight: 700; font-size: 1rem;
            transition: all 0.2s;
        }
        .pill:hover { background: #f9f9f9; transform: translateY(-2px); }
        .pill.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }

        .modern-select, .modern-input {
            padding: 12px 18px; border-radius: 12px; border: 1px solid #eee;
            background: #fff; color: #555; outline: none; font-size: 1rem;
        }
        .search-wrapper { position: relative; display: flex; align-items: center; }
        .search-wrapper i { position: absolute; left: 15px; color: #aaa; font-size: 1.1rem; }
        .modern-input { padding-left: 40px; width: 220px; }

        /* --- GRID --- */
        .pets-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 35px; max-width: 1250px; margin: 40px auto; padding: 0 25px;
        }

        .pet-card {
            background: white; border-radius: 20px; overflow: hidden;
            border: 1px solid #f0f0f0; transition: transform 0.3s;
        }
        .pet-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

        .pet-img-container { height: 260px; position: relative; }
        .pet-img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255,255,255,0.95); padding: 8px 16px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 700; color: var(--primary);
        }

        .pet-info { padding: 25px; text-align: center; }
        .pet-name { font-size: 1.6rem; margin: 0 0 5px; font-weight: 800; color: var(--secondary); }
        .pet-meta { color: #888; font-size: 1rem; margin-bottom: 20px; }
        
        .tags { display: flex; gap: 8px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .tag { color: #666; font-size: 0.9rem; background: #f5f5f5; padding: 6px 12px; border-radius: 8px; }

        .btn-action {
            display: inline-block; width: 100%; padding: 14px 0;
            background: #27ae60; color: white; text-decoration: none;
            border-radius: 12px; font-weight: 700; font-size: 1.05rem; transition: background 0.2s;
        }
        .btn-action:hover { background: #219150; }

        @media (max-width: 900px) {
            nav { flex-direction: column; gap: 20px; padding: 25px; }
            .nav-center { flex-wrap: wrap; justify-content: center; gap: 20px; }
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo"><i class="fas fa-paw"></i> The Loyal Nest</a>
        
        <div class="nav-center">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="search-pets.html" class="nav-link active">Buscar Mascotas</a>
            <a href="shelters-map.html" class="nav-link">Refugios</a>
            <a href="education.html" class="nav-link"><i class="fas fa-book-open" style="font-size:1rem;"></i> Educación</a>
        </div>

        <div id="auth-section">
            <a href="auth.html" id="nav-login" class="btn-login">Iniciar Sesión</a>
            
            <div id="nav-user" style="display:none; gap:10px; align-items:center;">
                <span style="font-weight:700; color:#555; font-size:1.1rem;">Mi Cuenta</span>
                <button class="btn-login" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <h1>Encuentra a tu compañero ideal <i class="fas fa-paw" style="color:#555; font-size:2rem;"></i></h1>
        <p>Utiliza los filtros para encontrar la mascota perfecta para ti.</p>
        
        <div class="filters-container">
            <button class="pill active" onclick="filtrarEspecie(this, '')">Todos</button>
            <button class="pill" onclick="filtrarEspecie(this, 'perro')">Perros 🐶</button>
            <button class="pill" onclick="filtrarEspecie(this, 'gato')">Gatos 🐱</button>

            <select id="filterSize" class="modern-select">
                <option value="">Cualquier tamaño</option>
                <option value="pequeño">Pequeño</option>
                <option value="mediano">Mediano</option>
                <option value="grande">Grande</option>
            </select>
            
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="filterSearch" class="modern-input" placeholder="Buscar por nombre...">
            </div>
        </div>
    </section>

    <div id="petsContainer" class="pets-grid"></div>

    <script src="js/auth.js"></script> 
    
    <script>
        // --- 1. BASE DE DATOS ---
        const petsData = [
            { id: 1, name: "Bruno", species: "perro", breed: "Labrador", size: "grande", age: "3 años", desc: "Bruno es un labrador ideal para familias activas.", tags: ["juguetón", "sociable"], img: "https://images.unsplash.com/photo-1552053831-71594a27632d?w=500&q=80" },
            { id: 2, name: "Maya", species: "perro", breed: "Corgi", size: "pequeño", age: "9 meses", desc: "Pequeña pero con mucha personalidad. Ama los trucos.", tags: ["tierna", "curiosa"], img: "https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?w=500&q=80" },
            { id: 3, name: "Coco", species: "perro", breed: "Poodle", size: "pequeño", age: "2 años", desc: "Perfecto para depas, muy limpio y educado.", tags: ["cariñoso", "listo"], img: "https://images.unsplash.com/photo-1591769225440-811ad7d6eca6?w=500&q=80" },
            { id: 4, name: "Rocky", species: "perro", breed: "Pastor Alemán", size: "grande", age: "4 años", desc: "Guardián noble que busca aventuras.", tags: ["leal", "protector"], img: "https://images.unsplash.com/photo-1589941013453-ec89f33b5e95?w=500&q=80" },
            { id: 5, name: "Luna", species: "gato", breed: "Mestizo", size: "pequeño", age: "1 año", desc: "Gatita negra muy elegante y tranquila.", tags: ["tranquila", "misteriosa"], img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500&q=80" },
            { id: 6, name: "Michi", species: "gato", breed: "Atigrado", size: "mediano", age: "6 meses", desc: "Torbellino de energía, ideal para jugar.", tags: ["juguetón", "activo"], img: "https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?w=500&q=80" },
            { id: 7, name: "Simba", species: "gato", breed: "Persa", size: "mediano", age: "3 años", desc: "Rey de la casa, busca un sofá cómodo.", tags: ["peludo", "noble"], img: "https://images.unsplash.com/photo-1574158622682-e40e69881006?w=500&q=80" },
            { id: 8, name: "Nieve", species: "gato", breed: "Blanco", size: "pequeño", age: "2 años", desc: "Tímida al principio pero muy dulce.", tags: ["dulce", "tímida"], img: "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=500&q=80" }
        ];

        // --- 2. VARIABLES Y ELEMENTOS ---
        const container = document.getElementById('petsContainer');
        let currentSpecies = "";
        let currentSize = "";
        let currentSearch = "";

        // --- 3. FUNCIONES DE RENDERIZADO ---
        function renderPets() {
            container.innerHTML = "";
            
            const filtered = petsData.filter(pet => {
                const matchSpecies = currentSpecies === "" || pet.species === currentSpecies;
                const matchSize = currentSize === "" || pet.size === currentSize;
                const matchSearch = pet.name.toLowerCase().includes(currentSearch);
                return matchSpecies && matchSize && matchSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:#777; padding:20px; font-size:1.1rem;'>No encontramos mascotas con esos filtros.</p>";
                return;
            }

            filtered.forEach(pet => {
                const tagsHTML = pet.tags.map(tag => `<span class="tag"><i class="fas fa-tag" style="font-size:0.8rem;"></i> ${tag}</span>`).join('');
                
                const card = `
                    <article class="pet-card">
                        <div class="pet-img-container">
                            <img src="${pet.img}" class="pet-img" alt="${pet.name}">
                            <span class="badge">${pet.species === 'perro' ? 'Perro' : 'Gato'}</span>
                        </div>
                        <div class="pet-info">
                            <h3 class="pet-name">${pet.name}</h3>
                            <div class="pet-meta">${pet.breed} · ${pet.age}</div>
                            <p style="font-size:1rem; color:#666; margin-bottom:20px; min-height:50px;">${pet.desc}</p>
                            <div class="tags">${tagsHTML}</div>
                            <a href="pet-profile.html?id=${pet.id}" class="btn-action">Ver Perfil / Adoptar</a>
                        </div>
                    </article>
                `;
                container.innerHTML += card;
            });
        }

        // --- 4. FUNCIONES DE INTERACCIÓN (FILTROS) ---
        
        function filtrarEspecie(boton, especie) {
            document.querySelectorAll('.pill').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');
            currentSpecies = especie;
            renderPets();
        }

        document.getElementById('filterSize').addEventListener('change', (e) => {
            currentSize = e.target.value;
            renderPets();
        });

        document.getElementById('filterSearch').addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase();
            renderPets();
        });

        // --- 5. SEGURIDAD DE RESPALDO ---
        if (typeof cerrarSesion === 'undefined') {
            window.cerrarSesion = function() {
                localStorage.removeItem("usuarioLogueado");
                window.location.href = "auth.html";
            };
        }

        document.addEventListener("DOMContentLoaded", renderPets);

    </script>
</body>
</html>
