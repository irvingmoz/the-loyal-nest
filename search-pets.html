<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Mascotas – The Loyal Nest</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ======== ESTILOS DE TARJETAS ======== */
        .pet-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pet-card__image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }

        .pet-card__meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pet-chip {
            padding: 4px 10px;
            background: #f1f1f1;
            border-radius: 50px;
            font-size: 12px;
            text-transform: capitalize;
        }

        .pet-card__tags span {
            display: inline-block;
            margin-right: 8px;
            font-size: 13px;
        }

        .btn-primary {
            background: #0077ff;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .pill {
            padding: 6px 14px;
            border-radius: 20px;
            background: #ececec;
            cursor: pointer;
        }

        .pill--active {
            background: #0077ff;
            color: #fff;
        }

        <section style="display:flex; gap:20px; margin-bottom:30px;">
    <input id="filterSearch" type="text" placeholder="Buscar por nombre, temperamento…" style="flex:1; padding:12px;">

    <select id="filterBreed" style="padding:12px;">
        <option value="">Raza</option>
    </select>

    <select id="filterSize" style="padding:12px;">
        <option value="">Tamaño</option>
        <option value="pequeño">Pequeño</option>
        <option value="mediano">Mediano</option>
        <option value="grande">Grande</option>
    </select>
    
    <select id="filterAge" style="padding:12px;">
        <option value="">Edad</option>
        <option value="cachorro">Cachorro (menos de 1 año)</option>
        <option value="adulto">Adulto (1 - 7 años)</option>
        <option value="senior">Senior (más de 7 años)</option>
    </select>
</section>

        /* Drawer */
        #adoptionDrawer {
            position: fixed;
            top: 0; right: 0;
            width: 380px;
            height: 100%;
            background: #fff;
            border-left: 1px solid #ddd;
            padding: 20px;
            transform: translateX(100%);
            transition: 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #adoptionDrawer[aria-hidden="false"] {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-outline {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #0077ff;
            background: #fff;
            cursor: pointer;
        }

        .status-chip {
            padding: 4px 7px;
            border-radius: 8px;
            text-transform: capitalize;
        }

        .status-chip.pending { background: #ffd27f; }
        .status-chip.approved { background: #88e27e; }
        .status-chip.rejected { background: #ff8a8a; }

        .table__row {
            display: grid;
            grid-template-columns: 150px 150px 1fr 100px 140px;
            padding: 10px 6px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Encuentra a tu compañero ideal 🐾</h1>

        <!-- 🔵 FILTROS DE ESPECIE -->
        <section id="speciesFilters" style="display:flex; gap:12px; margin:20px 0;">
            <span class="pill" data-species="">Todos</span>
            <span class="pill" data-species="perro">Perros</span>
            <span class="pill" data-species="gato">Gatos</span>
        </section>

        <!-- 🔵 FILTROS AVANZADOS -->
        <section style="display:flex; gap:20px; margin-bottom:30px;">
            <input id="filterSearch" type="text" placeholder="Buscar por nombre, temperamento…" style="flex:1; padding:12px;">

            <select id="filterBreed" style="padding:12px;">
                <option value="">Raza</option>
            </select>

            <select id="filterSize" style="padding:12px;">
                <option value="">Tamaño</option>
                <option value="pequeño">Pequeño</option>
                <option value="mediano">Mediano</option>
                <option value="grande">Grande</option>
            </select>
        </section>

        <!-- 🔵 RESULTADOS -->
        <section id="catalogPanel">
            <h2>Catálogo de Mascotas</h2>
            <div id="searchResults" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:20px;"></div>
        </section>

        <hr style="margin:50px 0;">

        <!-- 🔵 PANEL ADMIN -->
        <section id="adminPanel">
            <h2>Solicitudes de adopción</h2>

            <p id="requestEmpty" class="muted">No hay solicitudes todavía.</p>

            <div id="requestsTable" style="display:none;">
                <div class="table__row" style="font-weight:bold;">
                    <span>Solicitante</span>
                    <span>Mascota</span>
                    <span>Mensaje</span>
                    <span>Estado</span>
                    <span>Acciones</span>
                </div>

                <div id="requestsBody"></div>
            </div>
        </section>

    </main>

    <!-- ==================== -->
    <!-- 🔵 DRAWER DE ADOPCIÓN -->
    <!-- ==================== -->
    <aside id="adoptionDrawer" aria-hidden="true">

        <div class="drawer-header">
            <h2>Adoptar a <span id="drawerPetName"></span></h2>
            <button id="closeDrawer">✖</button>
        </div>

        <p id="drawerPetMeta" class="muted"></p>

        <form id="adoptionForm" style="display:flex; flex-direction:column; gap:12px;">

            <input type="text" name="applicant" placeholder="Tu nombre" required>
            <input type="email" name="email" placeholder="Tu correo" required>
            <textarea name="message" rows="4" placeholder="¿Por qué deseas adoptar a esta mascota?" required></textarea>

            <button class="btn-primary" type="submit">Enviar solicitud</button>
            <button type="button" id="cancelDrawer" class="btn-outline">Cancelar</button>
        </form>

    </aside>

    <!-- TU JS -->
    <script src="js/pets.js"></script>

</body>
</html>
