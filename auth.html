<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos centrados para el login */
        .auth-wrapper {
            display: flex; justify-content: center; align-items: center;
            min-height: calc(100vh - 80px); padding: 40px 20px;
            background-color: #f8f9fa; margin-top: 80px;
        }
        .auth-card {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .auth-switch { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <header class="header">
        <nav class="nav">
            <a href="index.html" class="logo">🐕 The Loyal Nest</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li class="nav-auth">
                    <a href="auth.html" class="btn-outline">Iniciar Sesión</a>
                    <a href="register.html" class="btn-primary">Registrarse</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="color: var(--primary);">Bienvenido</h2>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="#" onclick="recuperarContra(event)" style="color: #666; font-size: 0.9rem; text-decoration: underline;">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <button type="submit" class="btn-primary btn-full" style="width: 100%;">Entrar</button>
            </form>

            <div class="auth-switch">
                ¿Aún no tienes cuenta? <a href="register.html" style="color: var(--primary); font-weight: bold;">Regístrate aquí</a>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
</body>
</html>
