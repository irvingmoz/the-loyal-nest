<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de mascota | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <nav class="nav">
        <a href="index.html" class="logo">🐕 The Loyal Nest</a>
        <ul class="nav-links">
            <li><a href="search-pets.html">Buscar</a></li>
            <li class="nav-user" style="display:none; gap:8px; align-items:center;">
                <span class="nav-user-name"></span>
                <button class="btn-outline" data-action="logout">Salir</button>
            </li>
        </ul>
    </nav>
</header>

<main class="container" style="margin-top:110px; max-width:1100px;">
    <section class="panel" id="petProfileCard">
        <header class="panel__header">
            <div>
                <p class="muted">Ficha de mascota</p>
                <h1 data-field="name">Mascota</h1>
                <p class="muted" data-field="meta"></p>
            </div>
            <span class="status" data-field="status">disponible</span>
        </header>
        <p data-field="description">Descripción pendiente</p>
        <p><strong>Refugio / contacto:</strong> <span data-field="owner">-</span></p>
        <button class="btn-primary" data-hide-role="rescatista,rescuer" onclick="document.getElementById('adoptionModal').showModal()">Solicitar adopción</button>
    </section>

    <section class="panel">
        <header class="panel__header"><h2>Historial médico</h2></header>
        <table class="table">
            <thead><tr><th>Tipo</th><th>Fecha</th><th>Notas</th><th>Próxima</th></tr></thead>
            <tbody id="medicalHistory"></tbody>
        </table>
        <form id="medicalForm" class="form-grid" data-require-role="rescatista,rescuer">
            <label>Tipo<select name="type"><option>Vacuna</option><option>Desparasitación</option><option>Cita</option></select></label>
            <label>Fecha<input type="date" name="date" required></label>
            <label>Notas<textarea name="notes"></textarea></label>
            <label>Próxima fecha<input type="date" name="nextDate"></label>
            <button class="btn-outline" type="submit">Agregar entrada</button>
        </form>
    </section>

    <section class="panel">
        <header class="panel__header"><h2>Timeline de solicitudes</h2></header>
        <div id="adoptionRequests" class="cards-grid"></div>
    </section>
</main>

<dialog id="adoptionModal">
    <form id="adoptionRequestForm" class="form-grid" method="dialog">
        <h3>Solicitar adopción</h3>
        <label>Mensaje<textarea name="message" required></textarea></label>
        <input type="hidden" name="petId" value="">
        <button class="btn-primary" type="submit">Enviar</button>
        <div id="adoptionStatus" class="muted"></div>
    </form>
    <button class="btn-text" onclick="document.getElementById('adoptionModal').close()">Cerrar</button>
</dialog>

<script src="js/session.js"></script>
<script src="js/pets.js"></script>
<script src="js/medical.js"></script>
<script src="js/adoptions.js"></script>
<script>
    const petIdParam = new URLSearchParams(window.location.search).get('id');
    const requestForm = document.getElementById('adoptionRequestForm');
    if (requestForm && petIdParam) requestForm.petId.value = petIdParam;
</script>
</body>
</html>
