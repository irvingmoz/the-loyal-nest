<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-page">
<header class="header">
    <nav class="nav">
        <a href="index.html" class="logo">🐕 The Loyal Nest</a>
        <ul class="nav-links">
            <li><a href="search-pets.html">Buscar</a></li>
            <li><a href="adoption-requests.html">Solicitudes</a></li>
            <li class="nav-user" style="display:none; gap:8px; align-items:center;">
                <span class="nav-user-name"></span>
                <button class="btn-outline" data-action="logout">Salir</button>
            </li>
        </ul>
        <button id="notificationBell" class="btn-notification" aria-label="Notificaciones">
            🔔 <span id="notificationCount" class="notification-badge">0</span>
        </button>
    </nav>
</header>

<main class="main-content" style="margin-top:90px;">
    <section class="panel">
        <header class="panel__header">
            <div>
                <p class="muted">Panel</p>
                <h1>Administración</h1>
            </div>
        </header>
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-number" data-stat="users">--</span><span class="stat-label">Usuarios</span></div>
            <div class="stat-card"><span class="stat-number" data-stat="shelters">--</span><span class="stat-label">Refugios</span></div>
            <div class="stat-card"><span class="stat-number" data-stat="reports">--</span><span class="stat-label">Reportes</span></div>
        </div>
    </section>

    <section class="panel" id="perfil">
        <header class="panel__header"><h2>Mi perfil</h2></header>
        <form class="form-grid" id="profileForm">
            <label>Nombre<input name="name" required></label>
            <label>Correo<input type="email" name="email" required></label>
            <label>Foto<input type="file" name="avatar" accept="image/*"></label>
            <button class="btn-primary" type="submit">Guardar cambios</button>
        </form>
    </section>

    <section class="panel" id="reporte-admin">
        <header class="panel__header">
            <h2>Reportes del sistema</h2>
            <div class="panel__actions">
                <button id="exportCsv" class="btn-outline">Exportar CSV</button>
            </div>
        </header>
        <canvas id="reportCanvas" height="200"></canvas>
    </section>
</main>

<ul id="notificationList" class="notification-list"></ul>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/session.js"></script>
<script src="js/notifications.js"></script>
<script src="js/reports.js"></script>
<script>
    const user = requireAuth(['administrador']);
    if (user) {
        const form = document.getElementById('profileForm');
        if (form) {
            form.name.value = user.name || '';
            form.email.value = user.email || '';
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = new FormData(form);
                await apiFetch(`/profiles/${user.id}`, { method: 'PUT', body: data });
                alert('Perfil actualizado');
            });
        }
    }
</script>
</body>
</html>
