<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Rescatista | The Loyal Nest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-page">
<header class="header">
    <nav class="nav">
        <a href="index.html" class="logo">🐕 The Loyal Nest</a>
        <ul class="nav-links">
            <li><a href="search-pets.html">Buscar</a></li>
            <li><a href="adoption-requests.html">Solicitudes</a></li>
            <li class="nav-user" style="display:none; gap:8px; align-items:center;">
                <span class="nav-user-name"></span>
                <button class="btn-outline" data-action="logout">Salir</button>
            </li>
        </ul>
        <button id="notificationBell" class="btn-notification" aria-label="Notificaciones">
            🔔 <span id="notificationCount" class="notification-badge">0</span>
        </button>
    </nav>
</header>

<main class="main-content" style="margin-top:90px;">
    <section class="panel">
        <header class="panel__header">
            <div>
                <p class="muted">Panel</p>
                <h1>Centro de Rescate</h1>
            </div>
            <div class="panel__actions">
                <a class="btn-primary" href="add-pet.html">Agregar mascota</a>
                <a class="btn-outline" href="#perfil">Mi perfil</a>
            </div>
        </header>
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-number" data-stat="pets">--</span><span class="stat-label">Mascotas activas</span></div>
            <div class="stat-card"><span class="stat-number" data-stat="adoptions">--</span><span class="stat-label">Solicitudes</span></div>
            <div class="stat-card"><span class="stat-number" data-stat="vaccines">--</span><span class="stat-label">Vacunas al día</span></div>
            <div class="stat-card"><span class="stat-number" data-stat="alerts">--</span><span class="stat-label">Alertas</span></div>
        </div>
    </section>

    <section class="panel" id="perfil">
        <header class="panel__header"><h2>Perfil del refugio</h2></header>
        <form class="form-grid" id="profileForm">
            <label>Nombre del refugio<input name="name" required></label>
            <label>Correo contacto<input type="email" name="email" required></label>
            <label>Ubicación<input name="location"></label>
            <label>Foto<br><input type="file" name="avatar" accept="image/*"></label>
            <button class="btn-primary" type="submit">Guardar cambios</button>
        </form>
    </section>

    <section class="panel" id="mascotas">
        <header class="panel__header"><h2>Mis mascotas</h2></header>
        <div id="petList" class="cards-grid"></div>
    </section>

    <section class="panel" id="solicitudes">
        <header class="panel__header"><h2>Solicitudes de adopción</h2></header>
        <div id="adoptionRequests" class="cards-grid"></div>
    </section>

    <section class="panel" id="reportes">
        <header class="panel__header">
            <h2>Reportes</h2>
            <div class="panel__actions">
                <button id="exportCsv" class="btn-outline">Exportar CSV</button>
            </div>
        </header>
        <canvas id="reportCanvas" height="180"></canvas>
    </section>
</main>

<ul id="notificationList" class="notification-list"></ul>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/session.js"></script>
<script src="js/notifications.js"></script>
<script src="js/pets.js"></script>
<script src="js/adoptions.js"></script>
<script src="js/reports.js"></script>
<script>
    const user = requireAuth(['rescatista', 'rescuer']);
    if (user) {
        const profileForm = document.getElementById('profileForm');
        if (profileForm) {
            profileForm.name.value = user.name || '';
            profileForm.email.value = user.email || '';
            profileForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = new FormData(profileForm);
                await apiFetch(`/profiles/${user.id}`, { method: 'PUT', body: data });
                alert('Perfil actualizado');
            });
        }
    }
</script>
</body>
</html>
